workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      - name: Extract OurIDE source
        script: |
          set -e

          ZIP="$CM_BUILD_DIR/OurIDE_GITHUB_SOURCE_ROOT.zip"

          test -f "$ZIP"

          rm -rf "$CM_BUILD_DIR/ouride_src"
          mkdir -p "$CM_BUILD_DIR/ouride_src"

          unzip -q "$ZIP" -d "$CM_BUILD_DIR/ouride_src"

          OURIDE_DIR="$CM_BUILD_DIR/ouride_src"

          test -f "$OURIDE_DIR/gradlew"
          test -f "$OURIDE_DIR/settings.gradle.kts"

          echo "OurIDE directory: $OURIDE_DIR"
          echo "OURIDE_DIR=$OURIDE_DIR" >> "$CM_ENV"

          chmod +x "$OURIDE_DIR/gradlew"

      - name: Set Android SDK
        script: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$OURIDE_DIR/local.properties"

      - name: Install Android SDK 36
        script: |
          set -e

          SDKMANAGER="/usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Download Gradle 9.6.0
        script: |
          set -e

          GRADLE_VERSION="9.6.0"

          GRADLE_ZIP="$CM_BUILD_DIR/gradle-$GRADLE_VERSION-bin.zip"
          GRADLE_SHA="$CM_BUILD_DIR/gradle-$GRADLE_VERSION-bin.zip.sha256"

          GRADLE_URL="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          SHA_URL="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip.sha256"

          touch "$GRADLE_ZIP"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            -C - \
            "$GRADLE_URL" \
            -o "$GRADLE_ZIP"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$SHA_URL" \
            -o "$GRADLE_SHA"

          EXPECTED_SHA=$(tr -d '[:space:]' < "$GRADLE_SHA")
          ACTUAL_SHA=$(shasum -a 256 "$GRADLE_ZIP" | awk '{print $1}')

          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"

          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          echo "Gradle archive verified."

      - name: Install Gradle
        script: |
          set -e

          GRADLE_VERSION="9.6.0"

          GRADLE_ZIP="$CM_BUILD_DIR/gradle-$GRADLE_VERSION-bin.zip"
          GRADLE_HOME="$CM_BUILD_DIR/gradle-$GRADLE_VERSION"

          rm -rf "$GRADLE_HOME"

          unzip -q "$GRADLE_ZIP" -d "$CM_BUILD_DIR"

          test -x "$GRADLE_HOME/bin/gradle"

          "$GRADLE_HOME/bin/gradle" --version

      - name: Remove missing Gradle projects
        script: |
          set -e

          cd "$OURIDE_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path.cwd()

          settings_files = list(ROOT.rglob("settings.gradle.kts"))
          print(f"Found {len(settings_files)} settings.gradle.kts files")

          # Matches project entries such as:
          #   ":testing:gradleToolingTest",
          #   ":desugaring-core",
          project_token = re.compile(r'"(:[^"]+)"')

          changed_files = 0

          for settings in settings_files:
              base = settings.parent
              text = settings.read_text()

              original = text

              def token_exists(project: str) -> bool:
                  project_path = base.joinpath(*project.lstrip(":").split(":"))
                  return project_path.is_dir()

              # Remove only missing project entries from include(...) blocks.
              lines = text.splitlines(keepends=True)
              output = []
              in_include = False

              for line in lines:
                  stripped = line.strip()

                  if stripped.startswith("include("):
                      in_include = True
                      output.append(line)
                      continue

                  if in_include and stripped == ")":
                      in_include = False
                      output.append(line)
                      continue

                  if in_include:
                      matches = list(project_token.finditer(line))

                      if matches:
                          removed_any = False
                          new_line = line

                          for m in reversed(matches):
                              project = m.group(1)
                              if not token_exists(project):
                                  print(
                                      f"Disabling missing project "
                                      f"{project} in {settings.relative_to(ROOT)}"
                                  )
                                  start, end = m.span()
                                  left = new_line[:start]
                                  right = new_line[end:]

                                  # Also remove a following comma when possible.
                                  right = re.sub(r'^\s*,', '', right, count=1)

                                  new_line = left + right
                                  removed_any = True

                          if removed_any:
                              changed_files += 1
                              line = new_line

                  output.append(line)

              new_text = "".join(output)

              if new_text != original:
                  backup = settings.with_suffix(settings.suffix + ".codemagic-backup")
                  if not backup.exists():
                      backup.write_text(original)
                  settings.write_text(new_text)

          print(f"Modified settings entries: {changed_files}")

          # Show every remaining project include after cleanup.
          print("\nRemaining included projects:")
          for settings in settings_files:
              print(f"\n--- {settings.relative_to(ROOT)} ---")
              text = settings.read_text()
              inside = False
              for line in text.splitlines():
                  s = line.strip()
                  if s.startswith("include("):
                      inside = True
                  if inside:
                      print(line)
                  if inside and s == ")":
                      inside = False
          PY

      - name: Verify Gradle project
        script: |
          set -e

          cd "$OURIDE_DIR"

          GRADLE="$CM_BUILD_DIR/gradle-9.6.0/bin/gradle"

          echo "Gradle version:"
          "$GRADLE" --version

          echo ""
          echo "Checking Gradle projects..."

          "$GRADLE" projects --no-daemon

      - name: Build OurIDE
        script: |
          set -e

          cd "$OURIDE_DIR"

          GRADLE="$CM_BUILD_DIR/gradle-9.6.0/bin/gradle"

          echo "Building OurIDE..."

          "$GRADLE" \
            :core:app:assembleDebug \
            --stacktrace \
            --no-daemon

    artifacts:
      - "ouride_src/core/app/build/outputs/apk/debug/*.apk"
      - "ouride_src/core/app/build/outputs/apk/debug/output-metadata.json"
