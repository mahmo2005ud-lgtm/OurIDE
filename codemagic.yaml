workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Restore OurIDE source archive
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00"
          test -f "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01"
          cat "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00" "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01" > OurIDE_SOURCE_CLEAN_1.0.1.zip
          rm -rf restored_ouride
          mkdir restored_ouride
          unzip -q OurIDE_SOURCE_CLEAN_1.0.1.zip -d restored_ouride

          PROJECT_ROOT=""
          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"
            if [ -f "$candidate/gradlew" ] && [ -d "$candidate/core/app" ]; then
              PROJECT_ROOT="$candidate"
              break
            fi
          done < <(find restored_ouride -type f -name settings.gradle.kts -print)

          test -n "$PROJECT_ROOT"
          cp -R "$PROJECT_ROOT"/. "$CM_BUILD_DIR"/
          rm -rf restored_ouride OurIDE_SOURCE_CLEAN_1.0.1.zip OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00 OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01

      - name: Configure Android SDK
        script: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Modernize Kotlin compiler options
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          failures = []

          def find_matching_brace(text, open_pos):
              depth = 0
              quote = None
              triple = False
              escape = False
              i = open_pos
              while i < len(text):
                  if triple:
                      if text.startswith('"""', i):
                          triple = False
                          i += 3
                      else:
                          i += 1
                      continue

                  c = text[i]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue

                  if text.startswith('"""', i):
                      triple = True
                      i += 3
                      continue
                  if c in ('"', "'"):
                      quote = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1

              raise ValueError('Unclosed Kotlin block')

          # Match kotlinOptions regardless of indentation, spacing, nesting,
          # receiver, or whether the block is one-line or multi-line.
          block_pattern = re.compile(r"(?P<prefix>\\bkotlinOptions\\s*\\{)")
          jvm_set_pattern = re.compile(r"(?m)^[ \\t]*jvmTarget\\s*=\\s*([\"'])(?:17|1\\.8)(?:[\"'])\\s*$")
          jvm_set_call_pattern = re.compile(r"(?m)^[ \\t]*jvmTarget\\s*\\.\\s*set\\s*\\(\\s*([\"'])(?:17|1\\.8)\\1\\s*\\)\\s*$")

          def migrate_file(path):
              text = path.read_text()
              original = text
              pos = 0
              replacements = []

              while True:
                  match = block_pattern.search(text, pos)
                  if not match:
                      break

                  open_pos = text.find('{', match.start(), match.end())
                  close_pos = find_matching_brace(text, open_pos)
                  body = text[open_pos + 1:close_pos]

                  body_clean = re.sub(r"(?m)//.*$", "", body)
                  body_clean = re.sub(r"/\\*.*?\\*/", "", body_clean, flags=re.S).strip()

                  jvm_value = None
                  if jvm_set_pattern.search(body):
                      jvm_value = 'JVM_17' if re.search(r'jvmTarget\\s*=\\s*[\"\']17[\"\']', body) else 'JVM_1_8'
                  elif jvm_set_call_pattern.search(body):
                      jvm_value = 'JVM_17' if re.search(r'jvmTarget\\s*\\.\\s*set\\s*\\(\\s*[\"\']17[\"\']', body) else 'JVM_1_8'

                  # This project only needs the jvmTarget migration. Preserve safety:
                  # refuse to rewrite a block that contains unrelated kotlinOptions keys.
                  normalized = re.sub(r"(?m)^[ \\t]*jvmTarget\\s*=.*$", "", body_clean)
                  normalized = re.sub(r"(?m)^[ \\t]*jvmTarget\\s*\\.\\s*set\\s*\\(.*\\)\\s*$", "", normalized)
                  normalized = normalized.strip()

                  if jvm_value is None:
                      failures.append(f'{path}: kotlinOptions has no supported jvmTarget value')
                  elif normalized:
                      failures.append(f'{path}: kotlinOptions contains unsupported settings: {normalized[:160]}')
                  else:
                      indent_match = re.search(r'(?m)^([ \\t]*)\\bkotlinOptions\\s*\\{', text[:match.start() + 1])
                      indent = indent_match.group(1) if indent_match else ''
                      replacement = 'compilerOptions { jvmTarget = JvmTarget.' + jvm_value + ' }'
                      replacements.append((match.start(), close_pos + 1, replacement))

                  pos = close_pos + 1

              for start, end, replacement in reversed(replacements):
                  text = text[:start] + replacement + text[end:]

              if text != original:
                  if 'import org.jetbrains.kotlin.gradle.dsl.JvmTarget' not in text:
                      text = 'import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n' + text
                  path.write_text(text)
                  changed.append(str(path))

          for path in Path('.').rglob('build.gradle.kts'):
              migrate_file(path)

          if failures:
              print('Kotlin compiler option migration errors:')
              for item in failures:
                  print(f'  {item}')
              raise SystemExit(1)

          remaining = []
          for path in Path('.').rglob('build.gradle.kts'):
              if re.search(r'\\bkotlinOptions\\s*\\{', path.read_text()):
                  remaining.append(str(path))

          if remaining:
              print('Deprecated kotlinOptions remains in:')
              for path in remaining:
                  print(f'  {path}')
              raise SystemExit(1)

          if not changed:
              raise SystemExit('No Kotlin compiler option migration was applied')

          print('Modernized Kotlin compiler options in:')
          for path in changed:
              print(f'  {path}')
          PY

      - name: Prepare Codemagic-compatible Gradle build
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle/libs.versions.toml")
          text = p.read_text()
          text = text.replace('agp = "9.4.0"', 'agp = "8.13.2"')
          text = text.replace('agp-tooling = "9.4.0"', 'agp-tooling = "8.13.2"')
          text = text.replace('ksp = "1.9.24-1.0.20"', 'ksp = "2.3.12"')
          p.write_text(text)
          PY

      - name: Verify project root
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f gradlew
          test -f settings.gradle.kts
          test -d core/app
          chmod +x gradlew

      - name: Build OurIDE
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          GRADLE_BIN="/Users/builder/programs/gradle-8.14.1/bin/gradle"
          test -x "$GRADLE_BIN"
          "$GRADLE_BIN" --version
          "$GRADLE_BIN" :core:app:assembleDebug --stacktrace --no-daemon

    artifacts:
      - "core/app/build/outputs/apk/debug/*.apk"
      - "core/app/build/outputs/apk/debug/output-metadata.json"
