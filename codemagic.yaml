workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Configure Android SDK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Verify project root
        script: |
          set -e
          test -f "$CM_BUILD_DIR/gradlew"
          test -f "$CM_BUILD_DIR/settings.gradle.kts"
          chmod +x "$CM_BUILD_DIR/gradlew"

      - name: Build OurIDE
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          ./gradlew :core:app:assembleDebug --stacktrace --no-daemon

    artifacts:
      - "core/app/build/outputs/apk/debug/*.apk"
      - "core/app/build/outputs/apk/debug/output-metadata.json"
