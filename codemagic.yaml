workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      - name: Extract OurIDE source
        script: |
          set -e

          ZIP="$CM_BUILD_DIR/OurIDE_GITHUB_SOURCE_ROOT.zip"

          test -f "$ZIP"

          rm -rf "$CM_BUILD_DIR/ouride_src"
          mkdir -p "$CM_BUILD_DIR/ouride_src"

          unzip -q "$ZIP" -d "$CM_BUILD_DIR/ouride_src"

          OURIDE_DIR="$CM_BUILD_DIR/ouride_src"

          test -f "$OURIDE_DIR/gradlew"
          test -f "$OURIDE_DIR/settings.gradle.kts"

          echo "OurIDE directory: $OURIDE_DIR"

          echo "OURIDE_DIR=$OURIDE_DIR" >> "$CM_ENV"

          chmod +x "$OURIDE_DIR/gradlew"


      - name: Set Android SDK
        script: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$OURIDE_DIR/local.properties"

          echo "Android SDK: $ANDROID_SDK_ROOT"


      - name: Install Android SDK 36
        script: |
          set -e

          SDKMANAGER="/usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"


      - name: Check installed Gradle
        script: |
          set +e

          if command -v gradle >/dev/null 2>&1; then
            echo "System Gradle found:"
            gradle --version
          else
            echo "No system Gradle command found."
          fi

          if [ -x "/Users/builder/programs/gradle-8.14.1/bin/gradle" ]; then
            echo "Codemagic preinstalled Gradle found:"
            "/Users/builder/programs/gradle-8.14.1/bin/gradle" --version
          fi

          echo ""
          echo "Required Gradle version for OurIDE: 9.6.0+"
          echo "Required AGP version: 9.4.0"


      - name: Check Gradle wrapper
        script: |
          set -e

          cd "$OURIDE_DIR"

          echo "Checking Gradle wrapper..."

          ./gradlew --version


      - name: Build OurIDE
        script: |
          set -e

          cd "$OURIDE_DIR"

          echo "Building OurIDE..."

          ./gradlew :core:app:assembleDebug \
            --stacktrace \
            --no-daemon


    artifacts:
      - "ouride_src/core/app/build/outputs/apk/debug/*.apk"
      - "ouride_src/core/app/build/outputs/apk/debug/output-metadata.json"
