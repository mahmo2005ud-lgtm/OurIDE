workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Restore OurIDE source archive
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00"
          test -f "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01"
          cat "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00" "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01" > OurIDE_SOURCE_CLEAN_1.0.1.zip
          rm -rf restored_ouride
          mkdir restored_ouride
          unzip -q OurIDE_SOURCE_CLEAN_1.0.1.zip -d restored_ouride
          PROJECT_ROOT=""
          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"
            if [ -f "$candidate/gradlew" ] && [ -d "$candidate/core/app" ]; then
              PROJECT_ROOT="$candidate"
              break
            fi
          done < <(find restored_ouride -type f -name settings.gradle.kts -print)
          test -n "$PROJECT_ROOT"
          cp -R "$PROJECT_ROOT"/. "$CM_BUILD_DIR"/
          rm -rf restored_ouride OurIDE_SOURCE_CLEAN_1.0.1.zip OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00 OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01

      - name: Configure Android SDK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Modernize legacy Kotlin DSL
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in Path('.').rglob('build.gradle.kts'):
              text = path.read_text()
              original = text
              text = re.sub(r'\bkotlinOptions\s*\{', 'compilerOptions {', text)
              text = re.sub(r'\bkotlinOptions(?=\s*\.)', 'compilerOptions', text)
              text = re.sub(r'\bjvmTarget\s*=\s*["\']17["\']', 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17', text)
              text = re.sub(r'\bjvmTarget\.set\(\s*["\']17["\']\s*\)', 'jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)', text)
              text = re.sub(r'\bjvmTarget\s*=\s*["\']1\.8["\']', 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8', text)
              text = re.sub(r'\bjvmTarget\.set\(\s*["\']1\.8["\']\s*\)', 'jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)', text)
              text = re.sub(r'\bjvmTarget\s*=\s*BuildConfig\.javaVersion\.toString\(\)', 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(BuildConfig.javaVersion.toString())', text)
              text = re.sub(r'\bfreeCompilerArgs\s*\+=\s*listOf\(([^\n]*)\)', r'freeCompilerArgs.addAll(listOf(\1))', text)
              text = re.sub(r'\bfreeCompilerArgs\s*\+=\s*([^\n]+)', r'freeCompilerArgs.add(\1)', text)

              # Kotlin 2.3 warns/fails when kotlin-dsl is combined with an explicit
              # kotlin-jvm plugin. Convention/precompiled build logic should let
              # kotlin-dsl provide Gradle's embedded Kotlin version instead.
              if '`kotlin-dsl`' in text or 'kotlin("dsl")' in text or 'org.gradle.kotlin.kotlin-dsl' in text:
                  lines = text.splitlines(True)
                  kept = []
                  removed = 0
                  for line in lines:
                      stripped = line.strip()
                      is_kotlin_jvm = (
                          'kotlin("jvm")' in stripped
                          or 'id("org.jetbrains.kotlin.jvm")' in stripped
                          or "id('org.jetbrains.kotlin.jvm')" in stripped
                          or 'org.jetbrains.kotlin.jvm' in stripped and ('alias(' in stripped or 'apply(' in stripped)
                      )
                      if is_kotlin_jvm:
                          removed += 1
                          continue
                      kept.append(line)
                  text = ''.join(kept)
                  if removed:
                      changed.append(f'{path} (removed explicit kotlin-jvm)')

              if text != original:
                  path.write_text(text)
                  if str(path) not in changed:
                      changed.append(str(path))

          # Also patch any explicit Kotlin JVM plugin version in build-logic/composite
          # build files to the Gradle-embedded Kotlin version used by kotlin-dsl.
          for path in list(Path('build-logic').rglob('build.gradle.kts')) + list(Path('composite-builds').rglob('build.gradle.kts')):
              text = path.read_text()
              original = text
              if '`kotlin-dsl`' in text or 'kotlin("dsl")' in text:
                  text = re.sub(r'org\.jetbrains\.kotlin\.gradle\.plugin\.KotlinPluginWrapper\s*', '', text)
                  text = text.replace('version.ref = "kotlin"', 'version = embeddedKotlinVersion')
                  text = re.sub(r'(kotlin\("jvm"\)\s*)version\s+[^\n]+', r'\1', text)
                  if text != original:
                      path.write_text(text)
                      if str(path) not in changed:
                          changed.append(str(path))

          remaining = []
          for path in Path('.').rglob('build.gradle.kts'):
              if re.search(r'\bkotlinOptions\b', path.read_text()):
                  remaining.append(str(path))
          if remaining:
              print('kotlinOptions remains:')
              print('\n'.join(remaining))
              raise SystemExit(1)
          print('Migrated files:', len(changed))
          for item in changed:
              print('  ', item)
          PY

      - name: Prepare Codemagic-compatible Gradle build
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gradle/libs.versions.toml')
          text = p.read_text()
          text = text.replace('agp = "9.4.0"', 'agp = "8.13.2"')
          text = text.replace('agp-tooling = "9.4.0"', 'agp-tooling = "8.13.2"')
          text = text.replace('ksp = "1.9.24-1.0.20"', 'ksp = "2.3.12"')
          p.write_text(text)
          PY

      - name: Verify project root
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f gradlew
          test -f settings.gradle.kts
          test -d core/app
          chmod +x gradlew

      - name: Build OurIDE
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          GRADLE_BIN="/Users/builder/programs/gradle-8.14.1/bin/gradle"
          test -x "$GRADLE_BIN"
          "$GRADLE_BIN" --version
          "$GRADLE_BIN" :core:app:assembleDebug --stacktrace --no-daemon

    artifacts:
      - "core/app/build/outputs/apk/debug/*.apk"
      - "core/app/build/outputs/apk/debug/output-metadata.json"
