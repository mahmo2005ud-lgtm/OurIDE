workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Check source
        script: |
          set -e
          test -f AndroidIDE-dev/gradlew
          echo "OurIDE source found."

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/AndroidIDE-dev/local.properties"

      - name: Install Android SDK 36
        script: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "platform-tools"

      - name: Prepare Gradle
        script: |
          set -e
          cd "$CM_BUILD_DIR/AndroidIDE-dev"
          chmod +x gradlew
          ./gradlew --version

      - name: Build OurIDE Debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/AndroidIDE-dev"
          ./gradlew :core:app:assembleDebug \
            --stacktrace \
            --no-daemon

    artifacts:
      - AndroidIDE-dev/core/app/build/outputs/apk/debug/*.apk
      - AndroidIDE-dev/core/app/build/outputs/apk/debug/output-metadata.json
