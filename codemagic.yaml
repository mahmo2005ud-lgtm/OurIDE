workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Restore OurIDE source archive
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00"
          test -f "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01"
          cat "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00" "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01" > OurIDE_SOURCE_CLEAN_1.0.1.zip
          rm -rf restored_ouride
          mkdir restored_ouride
          unzip -q OurIDE_SOURCE_CLEAN_1.0.1.zip -d restored_ouride

          PROJECT_ROOT=""
          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"
            if [ -f "$candidate/gradlew" ] && [ -d "$candidate/core/app" ]; then
              PROJECT_ROOT="$candidate"
              break
            fi
          done < <(find restored_ouride -type f -name settings.gradle.kts -print)

          test -n "$PROJECT_ROOT"
          cp -R "$PROJECT_ROOT"/. "$CM_BUILD_DIR"/
          rm -rf restored_ouride OurIDE_SOURCE_CLEAN_1.0.1.zip OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00 OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01

      - name: Configure Android SDK
        script: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Modernize Kotlin compiler options
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          leftovers = []

          def find_matching_brace(s, open_pos):
              depth = 0
              quote = None
              triple = False
              escape = False
              i = open_pos
              while i < len(s):
                  if triple:
                      if s.startswith('"""', i):
                          triple = False
                          i += 3
                          continue
                      i += 1
                      continue
                  c = s[i]
                  if quote:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue
                  if s.startswith('"""', i):
                      triple = True
                      i += 3
                      continue
                  if c in ('"', "'"):
                      quote = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise ValueError('Unclosed Kotlin block')

          def migrate_file(path):
              text = path.read_text()
              original = text
              pos = 0
              replacements = []

              # Find every kotlinOptions block regardless of formatting, nesting,
              # receiver (android/task/target), or line layout.
              pattern = re.compile(r'(?m)(?P<indent>^[ \\t]*)?(?P<name>kotlinOptions)\\s*\\{')
              while True:
                  m = pattern.search(text, pos)
                  if not m:
                      break
                  open_pos = text.find('{', m.start(), m.end())
                  close_pos = find_matching_brace(text, open_pos)
                  body = text[open_pos + 1:close_pos]

                  # Support the common Kotlin 1.x/2.x spellings of jvmTarget.
                  body2 = re.sub(r'\\bjvmTarget\\s*=\\s*["\\']17["\\']', 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17', body)
                  body2 = re.sub(r'\\bjvmTarget\\s*\\.\\s*set\\s*\\(\\s*["\\']17["\\']\\s*\\)', 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17', body2)

                  # If the block contains only jvmTarget (plus whitespace/comments),
                  # replace the whole deprecated block with compilerOptions.
                  without_comments = re.sub(r'(?m)//.*$', '', body2)
                  without_comments = re.sub(r'/\\*.*?\\*/', '', without_comments, flags=re.S)
                  if re.fullmatch(r'\\s*(?:jvmTarget\\s*=\\s*org\\.jetbrains\\.kotlin\\.gradle\\.dsl\\.JvmTarget\\.JVM_17\\s*)?', without_comments):
                      replacement = '{\\n' + body2 + '\\n' + (m.group('indent') or '') + '}'
                      # Replace the block name only; preserve indentation and surrounding structure.
                      replacement = 'compilerOptions ' + replacement
                      replacements.append((m.start(), close_pos + 1, replacement))
                  else:
                      # Other kotlinOptions properties need manual mapping; do not silently corrupt them.
                      leftovers.append(f'{path}: kotlinOptions contains options beyond jvmTarget')
                  pos = close_pos + 1

              for start, end, replacement in reversed(replacements):
                  text = text[:start] + replacement + text[end:]

              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          for p in Path('.').rglob('build.gradle.kts'):
              migrate_file(p)

          if leftovers:
              print('Unmigrated kotlinOptions blocks:')
              for item in leftovers:
                  print(f'  {item}')
              raise SystemExit(1)

          target = Path('composite-builds/build-logic/common/build.gradle.kts')
          remaining = []
          for p in Path('.').rglob('build.gradle.kts'):
              if 'kotlinOptions' in p.read_text():
                  remaining.append(str(p))

          if remaining:
              print('Deprecated kotlinOptions remains in:')
              for p in remaining:
                  print(f'  {p}')
              raise SystemExit(1)

          if not changed:
              raise SystemExit('No Kotlin compiler option migration was applied')

          print('Modernized Kotlin compiler options in:')
          for p in changed:
              print(f'  {p}')
          PY

      - name: Prepare Codemagic-compatible Gradle build
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          # Codemagic macOS M2 images provide Gradle 8.14.1 preinstalled.
          # AGP 9.4 requires Gradle 9.6, so CI uses AGP 8.13.2 here.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle/libs.versions.toml")
          text = p.read_text()
          text = text.replace('agp = "9.4.0"', 'agp = "8.13.2"')
          text = text.replace('agp-tooling = "9.4.0"', 'agp-tooling = "8.13.2"')
          text = text.replace('ksp = "1.9.24-1.0.20"', 'ksp = "2.3.12"')
          p.write_text(text)
          PY

      - name: Verify project root
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f gradlew
          test -f settings.gradle.kts
          test -d core/app
          chmod +x gradlew

      - name: Build OurIDE
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          GRADLE_BIN="/Users/builder/programs/gradle-8.14.1/bin/gradle"
          test -x "$GRADLE_BIN"
          "$GRADLE_BIN" --version
          "$GRADLE_BIN" :core:app:assembleDebug --stacktrace --no-daemon

    artifacts:
      - "core/app/build/outputs/apk/debug/*.apk"
      - "core/app/build/outputs/apk/debug/output-metadata.json"
