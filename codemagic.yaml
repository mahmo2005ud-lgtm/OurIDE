workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      - name: Extract OurIDE source
        script: |
          set -e

          ZIP="$CM_BUILD_DIR/OurIDE_GITHUB_SOURCE_ROOT.zip"

          test -f "$ZIP"

          rm -rf "$CM_BUILD_DIR/ouride_src"
          mkdir -p "$CM_BUILD_DIR/ouride_src"

          unzip -q "$ZIP" -d "$CM_BUILD_DIR/ouride_src"

          OURIDE_DIR="$CM_BUILD_DIR/ouride_src"

          test -f "$OURIDE_DIR/gradlew"
          test -f "$OURIDE_DIR/settings.gradle.kts"

          echo "OurIDE directory: $OURIDE_DIR"

          echo "OURIDE_DIR=$OURIDE_DIR" >> "$CM_ENV"

          chmod +x "$OURIDE_DIR/gradlew"


      - name: Set Android SDK
        script: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$CM_BUILD_DIR/ouride_src/local.properties"


      - name: Install Android SDK 36
        script: |
          set -e

          SDKMANAGER="/usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"


      - name: Download Gradle 9.6.0
        script: |
          set -e

          GRADLE_VERSION="9.6.0"

          GRADLE_ZIP="$CM_BUILD_DIR/gradle-$GRADLE_VERSION-bin.zip"
          GRADLE_SHA="$CM_BUILD_DIR/gradle-$GRADLE_VERSION-bin.zip.sha256"

          GRADLE_URL="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          SHA_URL="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip.sha256"

          echo "Downloading Gradle $GRADLE_VERSION..."

          touch "$GRADLE_ZIP"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            -C - \
            "$GRADLE_URL" \
            -o "$GRADLE_ZIP"

          echo "Downloading SHA-256..."

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$SHA_URL" \
            -o "$GRADLE_SHA"

          EXPECTED_SHA=$(tr -d '[:space:]' < "$GRADLE_SHA")
          ACTUAL_SHA=$(shasum -a 256 "$GRADLE_ZIP" | awk '{print $1}')

          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"

          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          echo "Gradle archive verified."


      - name: Install Gradle
        script: |
          set -e

          GRADLE_VERSION="9.6.0"

          GRADLE_ZIP="$CM_BUILD_DIR/gradle-$GRADLE_VERSION-bin.zip"
          GRADLE_HOME="$CM_BUILD_DIR/gradle-$GRADLE_VERSION"

          rm -rf "$GRADLE_HOME"

          echo "Extracting Gradle..."

          unzip -q "$GRADLE_ZIP" -d "$CM_BUILD_DIR"

          test -x "$GRADLE_HOME/bin/gradle"

          "$GRADLE_HOME/bin/gradle" --version


      - name: Remove missing test project
        script: |
          set -e

          cd "$OURIDE_DIR"

          TEST_DIR="testing/gradleToolingTest"

          if [ ! -d "$TEST_DIR" ]; then
            echo "Missing test project detected: $TEST_DIR"
            echo "Removing its references from settings.gradle.kts..."

            cp settings.gradle.kts settings.gradle.kts.codemagic-backup

            python3 - <<'PY'
          from pathlib import Path

          path = Path("settings.gradle.kts")
          text = path.read_text()

          lines = text.splitlines(keepends=True)

          filtered = [
              line
              for line in lines
              if "gradleToolingTest" not in line
          ]

          new_text = "".join(filtered)

          if new_text == text:
              print("No gradleToolingTest reference found.")
          else:
              path.write_text(new_text)
              print("Removed gradleToolingTest references.")
          PY

            echo "Checking remaining references..."

            if grep -n "gradleToolingTest" settings.gradle.kts; then
              echo "ERROR: gradleToolingTest reference still exists."
              exit 1
            fi

            echo "Missing test project disabled for this CI build."
          else
            echo "Test project exists. No change required."
          fi


      - name: Verify Gradle project
        script: |
          set -e

          cd "$OURIDE_DIR"

          GRADLE="$CM_BUILD_DIR/gradle-9.6.0/bin/gradle"

          echo "Gradle version:"
          "$GRADLE" --version

          echo ""
          echo "Checking Gradle projects..."

          "$GRADLE" projects --no-daemon


      - name: Build OurIDE
        script: |
          set -e

          cd "$OURIDE_DIR"

          GRADLE="$CM_BUILD_DIR/gradle-9.6.0/bin/gradle"

          echo "Building OurIDE..."

          "$GRADLE" \
            :core:app:assembleDebug \
            --stacktrace \
            --no-daemon


    artifacts:
      - "ouride_src/core/app/build/outputs/apk/debug/*.apk"
      - "ouride_src/core/app/build/outputs/apk/debug/output-metadata.json"
