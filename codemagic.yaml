workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Restore OurIDE source archive
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00"
          test -f "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01"
          cat "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00" "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01" > OurIDE_SOURCE_CLEAN_1.0.1.zip
          rm -rf restored_ouride
          mkdir restored_ouride
          unzip -q OurIDE_SOURCE_CLEAN_1.0.1.zip -d restored_ouride
          PROJECT_ROOT=""
          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"
            if [ -f "$candidate/gradlew" ] && [ -d "$candidate/core/app" ]; then
              PROJECT_ROOT="$candidate"
              break
            fi
          done < <(find restored_ouride -type f -name settings.gradle.kts -print)
          test -n "$PROJECT_ROOT"
          cp -R "$PROJECT_ROOT"/. "$CM_BUILD_DIR"/
          rm -rf restored_ouride OurIDE_SOURCE_CLEAN_1.0.1.zip OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00 OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01

      - name: Configure Android SDK
        script: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Modernize Kotlin compiler options
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []

          def migrate(path):
              text = path.read_text()
              original = text

              # Migrate the old Kotlin DSL receiver without trying to parse nested Gradle braces.
              text = re.sub(r'\bkotlinOptions\s*\{', 'compilerOptions {', text)
              text = re.sub(r'\bkotlinOptions(?=\s*\.)', 'compilerOptions', text)

              # Kotlin compilerOptions uses typed JvmTarget values.
              text = re.sub(r'\bjvmTarget\s*=\s*["\']17["\']', 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17', text)
              text = re.sub(r'\bjvmTarget\.set\(\s*["\']17["\']\s*\)', 'jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)', text)
              text = re.sub(r'\bjvmTarget\s*=\s*["\']1\.8["\']', 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8', text)
              text = re.sub(r'\bjvmTarget\.set\(\s*["\']1\.8["\']\s*\)', 'jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)', text)
              text = re.sub(r'\bjvmTarget\s*=\s*BuildConfig\.javaVersion\.toString\(\)', 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(BuildConfig.javaVersion.toString())', text)

              # Migrate common freeCompilerArgs += forms used by the project.
              text = re.sub(r'\bfreeCompilerArgs\s*\+=\s*listOf\(([^\n]*)\)', r'freeCompilerArgs.addAll(listOf(\1))', text)
              text = re.sub(r'\bfreeCompilerArgs\s*\+=\s*([^\n]+)', r'freeCompilerArgs.add(\1)', text)

              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          for path in Path('.').rglob('build.gradle.kts'):
              migrate(path)

          remaining = []
          for path in Path('.').rglob('build.gradle.kts'):
              if re.search(r'\bkotlinOptions\b', path.read_text()):
                  remaining.append(str(path))

          if remaining:
              print('Deprecated kotlinOptions remains in:')
              for path in remaining:
                  print(f'  {path}')
              raise SystemExit(1)

          if not changed:
              raise SystemExit('No Kotlin compiler option migration was applied')

          print('Modernized Kotlin compiler options in:')
          for path in changed:
              print(f'  {path}')
          PY

      - name: Prepare Codemagic-compatible Gradle build
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("gradle/libs.versions.toml")
          text = p.read_text()
          text = text.replace('agp = "9.4.0"', 'agp = "8.13.2"')
          text = text.replace('agp-tooling = "9.4.0"', 'agp-tooling = "8.13.2"')
          text = text.replace('ksp = "1.9.24-1.0.20"', 'ksp = "2.3.12"')
          p.write_text(text)
          PY

      - name: Verify project root
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f gradlew
          test -f settings.gradle.kts
          test -d core/app
          chmod +x gradlew

      - name: Build OurIDE
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          GRADLE_BIN="/Users/builder/programs/gradle-8.14.1/bin/gradle"
          test -x "$GRADLE_BIN"
          "$GRADLE_BIN" --version
          "$GRADLE_BIN" :core:app:assembleDebug --stacktrace --no-daemon

    artifacts:
      - "core/app/build/outputs/apk/debug/*.apk"
      - "core/app/build/outputs/apk/debug/output-metadata.json"
