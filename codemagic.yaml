workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      - name: Extract OurIDE source
        script: |
          set -e

          ZIP="$CM_BUILD_DIR/OurIDE_GITHUB_SOURCE_ROOT.zip"

          test -f "$ZIP"

          rm -rf "$CM_BUILD_DIR/ouride_src"
          mkdir -p "$CM_BUILD_DIR/ouride_src"

          unzip -q "$ZIP" -d "$CM_BUILD_DIR/ouride_src"

          OURIDE_DIR="$CM_BUILD_DIR/ouride_src"

          test -f "$OURIDE_DIR/gradlew"
          test -f "$OURIDE_DIR/settings.gradle.kts"

          echo "OurIDE directory: $OURIDE_DIR"
          echo "OURIDE_DIR=$OURIDE_DIR" >> "$CM_ENV"

          chmod +x "$OURIDE_DIR/gradlew"


      - name: Set Android SDK
        script: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$OURIDE_DIR/local.properties"

          echo "Android SDK: $ANDROID_SDK_ROOT"


      - name: Install Android SDK 36
        script: |
          set -e

          SDKMANAGER="/usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"


      - name: Check available Gradle
        script: |
          set +e

          echo "Checking system Gradle..."

          if command -v gradle >/dev/null 2>&1; then
            gradle --version
          else
            echo "No Gradle command in PATH."
          fi

          echo ""
          echo "Required Gradle: 9.6.0+"


      - name: Download Gradle 9.6.0 with resume
        script: |
          set -e

          GRADLE_VERSION="9.6.0"
          GRADLE_BASE="$CM_BUILD_DIR/gradle-$GRADLE_VERSION"
          GRADLE_ZIP="$CM_BUILD_DIR/gradle-$GRADLE_VERSION-bin.zip"
          GRADLE_SHA="$CM_BUILD_DIR/gradle-$GRADLE_VERSION-bin.zip.sha256"

          mkdir -p "$GRADLE_BASE"

          GRADLE_URL="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          SHA_URL="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip.sha256"

          echo "Downloading Gradle $GRADLE_VERSION..."

          if [ ! -f "$GRADLE_ZIP" ]; then
            touch "$GRADLE_ZIP"
          fi

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            -C - \
            "$GRADLE_URL" \
            -o "$GRADLE_ZIP"

          echo "Downloading official SHA-256..."
          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$SHA_URL" \
            -o "$GRADLE_SHA"

          echo "Checking SHA-256..."
          cd "$CM_BUILD_DIR"

          shasum -a 256 -c "$GRADLE_SHA"

          echo "Gradle archive verified."


      - name: Install local Gradle
        script: |
          set -e

          GRADLE_VERSION="9.6.0"
          GRADLE_ZIP="$CM_BUILD_DIR/gradle-$GRADLE_VERSION-bin.zip"
          GRADLE_HOME="$CM_BUILD_DIR/gradle-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            echo "Extracting Gradle..."
            rm -rf "$GRADLE_HOME"
            unzip -q "$GRADLE_ZIP" -d "$CM_BUILD_DIR"
          fi

          test -x "$GRADLE_HOME/bin/gradle"

          echo "GRADLE_HOME=$GRADLE_HOME" >> "$CM_ENV"
          echo "$GRADLE_HOME/bin" >> "$CM_ENV_PATH"

          "$GRADLE_HOME/bin/gradle" --version


      - name: Prepare Gradle
        script: |
          set -e

          cd "$OURIDE_DIR"

          echo "Using local Gradle:"
          "$GRADLE_HOME/bin/gradle" --version


      - name: Build OurIDE
        script: |
          set -e

          cd "$OURIDE_DIR"

          echo "Starting OurIDE build..."

          "$GRADLE_HOME/bin/gradle" \
            :core:app:assembleDebug \
            --stacktrace \
            --no-daemon


    artifacts:
      - "ouride_src/core/app/build/outputs/apk/debug/*.apk"
      - "ouride_src/core/app/build/outputs/apk/debug/output-metadata.json"
