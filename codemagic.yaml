workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      - name: Extract OurIDE source
        script: |
          set -e

          ZIP="$CM_BUILD_DIR/OurIDE_GITHUB_SOURCE_ROOT.zip"

          test -f "$ZIP"

          rm -rf "$CM_BUILD_DIR/ouride_src"
          mkdir -p "$CM_BUILD_DIR/ouride_src"

          unzip -q "$ZIP" -d "$CM_BUILD_DIR/ouride_src"

          OURIDE_DIR="$CM_BUILD_DIR/ouride_src"

          test -f "$OURIDE_DIR/gradlew"
          test -f "$OURIDE_DIR/settings.gradle.kts"

          echo "OurIDE directory: $OURIDE_DIR"
          echo "OURIDE_DIR=$OURIDE_DIR" >> "$CM_ENV"

          chmod +x "$OURIDE_DIR/gradlew"

      - name: Set Android SDK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$OURIDE_DIR/local.properties"

      - name: Install Android SDK 36
        script: |
          set -e

          SDKMANAGER="/usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Download Gradle 9.6.0
        script: |
          set -e

          GRADLE_VERSION="9.6.0"
          GRADLE_ZIP="$CM_BUILD_DIR/gradle-$GRADLE_VERSION-bin.zip"
          GRADLE_SHA="$CM_BUILD_DIR/gradle-$GRADLE_VERSION-bin.zip.sha256"

          GRADLE_URL="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          SHA_URL="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip.sha256"

          touch "$GRADLE_ZIP"

          curl -L --fail \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            -C - \
            "$GRADLE_URL" \
            -o "$GRADLE_ZIP"

          curl -L --fail \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$SHA_URL" \
            -o "$GRADLE_SHA"

          EXPECTED_SHA=$(tr -d '[:space:]' < "$GRADLE_SHA")
          ACTUAL_SHA=$(shasum -a 256 "$GRADLE_ZIP" | awk '{print $1}')

          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"

          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Install Gradle
        script: |
          set -e

          GRADLE_VERSION="9.6.0"
          GRADLE_ZIP="$CM_BUILD_DIR/gradle-$GRADLE_VERSION-bin.zip"
          GRADLE_HOME="$CM_BUILD_DIR/gradle-$GRADLE_VERSION"

          rm -rf "$GRADLE_HOME"
          unzip -q "$GRADLE_ZIP" -d "$CM_BUILD_DIR"

          test -x "$GRADLE_HOME/bin/gradle"
          "$GRADLE_HOME/bin/gradle" --version

      - name: Remove missing projects
        script: |
          set -e

          cd "$OURIDE_DIR"

          cp settings.gradle.kts settings.gradle.kts.codemagic-backup

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("settings.gradle.kts")
          text = path.read_text()

          lines = text.splitlines(keepends=True)
          in_include = False
          changed = False
          output = []

          project_pattern = re.compile(r'^\s*"(:[^"]+)"\s*,?\s*$')

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("include("):
                  in_include = True
                  output.append(line)
                  continue

              if in_include and stripped == ")":
                  in_include = False
                  output.append(line)
                  continue

              if in_include:
                  m = project_pattern.match(line)
                  if m:
                      project = m.group(1)
                      project_dir = Path(project.lstrip(":").replace(":", "/"))

                      if not project_dir.is_dir():
                          print(f"Disabling missing project: {project} -> {project_dir}")
                          changed = True
                          continue

              output.append(line)

          if changed:
              path.write_text("".join(output))
          else:
              print("No missing included projects found.")
          PY

          echo "Included projects after cleanup:"
          sed -n '/^include(/,/^)/p' settings.gradle.kts

      - name: Verify Gradle project
        script: |
          set -e

          cd "$OURIDE_DIR"

          GRADLE="$CM_BUILD_DIR/gradle-9.6.0/bin/gradle"

          "$GRADLE" --version
          "$GRADLE" projects --no-daemon

      - name: Build OurIDE
        script: |
          set -e

          cd "$OURIDE_DIR"

          GRADLE="$CM_BUILD_DIR/gradle-9.6.0/bin/gradle"

          "$GRADLE" \
            :core:app:assembleDebug \
            --stacktrace \
            --no-daemon

    artifacts:
      - "ouride_src/core/app/build/outputs/apk/debug/*.apk"
      - "ouride_src/core/app/build/outputs/apk/debug/output-metadata.json"
