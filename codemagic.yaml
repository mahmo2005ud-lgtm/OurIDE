workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Restore OurIDE source archive
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          test -f "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00"
          test -f "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01"

          cat \
            "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00" \
            "OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01" \
            > OurIDE_SOURCE_CLEAN_1.0.1.zip

          rm -rf restored_ouride
          mkdir -p restored_ouride
          unzip -q OurIDE_SOURCE_CLEAN_1.0.1.zip -d restored_ouride

          PROJECT_ROOT=""
          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"
            if [ -f "$candidate/gradlew" ] && [ -d "$candidate/core/app" ]; then
              PROJECT_ROOT="$candidate"
              break
            fi
          done < <(find restored_ouride -type f -name settings.gradle.kts -print)

          test -n "$PROJECT_ROOT"
          cp -R "$PROJECT_ROOT"/. "$CM_BUILD_DIR"/

          rm -rf restored_ouride OurIDE_SOURCE_CLEAN_1.0.1.zip
          rm -f OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00 OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01

          chmod +x "$CM_BUILD_DIR/gradlew"

          # The source archive intentionally has no .git directory.
          # Our settings use Git detection for the Nyx versioning plugin.
          cd "$CM_BUILD_DIR"
          git init
          git config user.name "Codemagic"
          git config user.email "codemagic@localhost"
          git add -A
          git commit -m "Codemagic build snapshot" >/dev/null

      - name: Configure Android SDK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "Android SDK: $ANDROID_SDK_ROOT"

      - name: Install Android SDK 36
        script: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Inspect the project compatibility matrix
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          echo "=== Java ==="
          java -version

          echo "=== Gradle Wrapper ==="
          grep -E 'distributionUrl=' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

          echo "=== Version catalog ==="
          grep -E '^(agp|agp-tooling|kotlin|ksp|gradle-tooling)\s*=' gradle/libs.versions.toml

      - name: Migrate legacy Kotlin compiler options
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []

          for path in Path('.').rglob('build.gradle.kts'):
              original = path.read_text()
              text = original

              # Kotlin 2.3.x no longer accepts the old kotlinOptions DSL.
              text = re.sub(r'\bkotlinOptions\s*\{', 'compilerOptions {', text)
              text = re.sub(r'\bkotlinOptions(?=\s*\.)', 'compilerOptions', text)

              # Convert the old String JVM target to the typed compilerOptions API.
              text = re.sub(
                  r'\bjvmTarget\s*=\s*["\']17["\']',
                  'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17',
                  text,
              )
              text = re.sub(
                  r'\bjvmTarget\.set\(\s*["\']17["\']\s*\)',
                  'jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)',
                  text,
              )
              text = re.sub(
                  r'\bjvmTarget\s*=\s*BuildConfig\.javaVersion\.toString\(\)',
                  'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(BuildConfig.javaVersion.toString())',
                  text,
              )

              # Convert legacy collection mutation to the compilerOptions API.
              text = re.sub(
                  r'\bfreeCompilerArgs\s*\+=\s*listOf\(([^\n]*)\)',
                  r'freeCompilerArgs.addAll(listOf(\1))',
                  text,
              )
              text = re.sub(
                  r'\bfreeCompilerArgs\s*\+=\s*([^\n]+)',
                  r'freeCompilerArgs.add(\1)',
                  text,
              )

              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          leftovers = []
          for path in Path('.').rglob('build.gradle.kts'):
              if re.search(r'\bkotlinOptions\b', path.read_text()):
                  leftovers.append(str(path))

          if leftovers:
              print('ERROR: legacy kotlinOptions remains:')
              print('\n'.join(leftovers))
              raise SystemExit(1)

          print('Migrated files:', len(changed))
          for item in changed:
              print('  ' + item)
          PY

      - name: Verify source versions were not rewritten
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          echo "=== Final compatibility matrix ==="
          grep -E '^(agp|agp-tooling|kotlin|ksp|gradle-tooling)\s*=' gradle/libs.versions.toml

          # These are the versions the source was authored with.
          grep -q '^agp = "9.4.0"' gradle/libs.versions.toml
          grep -q '^agp-tooling = "9.4.0"' gradle/libs.versions.toml
          grep -q '^kotlin = "2.3.21"' gradle/libs.versions.toml
          grep -q '^ksp = "1.9.24-1.0.20"' gradle/libs.versions.toml

          test -f settings.gradle.kts
          test -d composite-builds/build-logic/desugaring
          test -d composite-builds/build-deps-common/desugaring-core
          test -d core/app

      - name: Build OurIDE
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          # The repository wrapper is Gradle 9.6, which embeds Kotlin 2.3.21.
          # This matches the project's Kotlin 2.3.21 build logic instead of
          # forcing an unrelated Gradle/Kotlin version during CI.
          ./gradlew :core:app:assembleDebug --stacktrace --no-daemon

          APK="$(find core/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "OurIDE Debug APK created successfully: $APK"

    artifacts:
      - "core/app/build/outputs/apk/debug/*.apk"
      - "core/app/build/outputs/apk/debug/output-metadata.json"
