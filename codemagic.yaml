workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120

    environment:
      java: 17

    scripts:
      - name: Extract OurIDE source
        script: |
          set -e
          test -f OurIDE_GITHUB_SOURCE_ROOT.zip
          rm -rf OurIDE
          mkdir OurIDE
          unzip -q OurIDE_GITHUB_SOURCE_ROOT.zip -d OurIDE
          test -f OurIDE/gradlew

      - name: Set Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/OurIDE/local.properties"

      - name: Install Android SDK 36
        script: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "platform-tools"

      - name: Prepare Gradle
        script: |
          cd "$CM_BUILD_DIR/OurIDE"
          chmod +x gradlew
          ./gradlew --version

      - name: Build OurIDE
        script: |
          set -e
          cd "$CM_BUILD_DIR/OurIDE"
          ./gradlew :core:app:assembleDebug \
            --stacktrace \
            --no-daemon

    artifacts:
      - OurIDE/core/app/build/outputs/apk/debug/*.apk
      - OurIDE/core/app/build/outputs/apk/debug/output-metadata.json
