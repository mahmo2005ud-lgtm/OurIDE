workflows:
  ouride-debug:
    name: OurIDE Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Restore OurIDE source archive
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          test -f OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00
          test -f OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01

          # Keep the tracked build-config sources that are outside the split archive.
          rm -rf /tmp/ouride-build-config
          mkdir -p /tmp/ouride-build-config
          CONFIG_SRC="composite-builds/build-logic/common/src/main/java/com/itsaky/androidide/build/config"
          if [ -d "$CONFIG_SRC" ]; then
            cp -R "$CONFIG_SRC" /tmp/ouride-build-config/
          fi

          cat OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00 \
              OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01 > OurIDE_SOURCE_CLEAN_1.0.1.zip

          rm -rf restored_ouride
          mkdir -p restored_ouride
          unzip -q OurIDE_SOURCE_CLEAN_1.0.1.zip -d restored_ouride

          PROJECT_ROOT=""
          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"
            if [ -f "$candidate/gradlew" ] && [ -d "$candidate/core/app" ]; then
              PROJECT_ROOT="$candidate"
              break
            fi
          done < <(find restored_ouride -type f -name settings.gradle.kts -print)
          test -n "$PROJECT_ROOT"

          cp -R "$PROJECT_ROOT"/. "$CM_BUILD_DIR"/

          # Restore the build-config package after archive extraction.
          if [ -d /tmp/ouride-build-config/config ]; then
            rm -rf "$CONFIG_SRC"
            mkdir -p "$(dirname "$CONFIG_SRC")"
            cp -R /tmp/ouride-build-config/config "$CONFIG_SRC"
          fi

          rm -rf restored_ouride /tmp/ouride-build-config OurIDE_SOURCE_CLEAN_1.0.1.zip
          rm -f OurIDE_SOURCE_CLEAN_1.0.1.zip.part-00 OurIDE_SOURCE_CLEAN_1.0.1.zip.part-01
          chmod +x gradlew

          git init
          git config user.name Codemagic
          git config user.email codemagic@localhost
          git add -A
          git commit -m "Codemagic build snapshot" >/dev/null

      - name: Configure Android SDK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Install Android SDK 34
        script: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Restore compatible Gradle and plugin versions
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          # The source is based on AndroidIDE's AGP 8.5 / Kotlin 1.9.24 matrix.
          # The archive was previously rewritten to a 9.x/2.3.x matrix; undo that
          # rewrite before Gradle starts. KSP 1.9.24-1.0.20 then matches Kotlin 1.9.24.
          sed -i '' 's/gradle-9\.6-bin\.zip/gradle-8.8-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          sed -i '' 's/agp = "9\.4\.0"/agp = "8.5.0"/' gradle/libs.versions.toml
          sed -i '' 's/agp-tooling = "9\.4\.0"/agp-tooling = "8.5.0"/' gradle/libs.versions.toml
          sed -i '' 's/kotlin = "2\.3\.21"/kotlin = "1.9.24"/' gradle/libs.versions.toml
          sed -i '' 's/gradle-tooling = "9\.6"/gradle-tooling = "8.6"/' gradle/libs.versions.toml

          echo "=== Java ==="
          java -version
          echo "=== Wrapper ==="
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          echo "=== Versions ==="
          grep -E '^(agp|agp-tooling|kotlin|ksp|gradle-tooling)[[:space:]]*=' gradle/libs.versions.toml

      - name: Verify source completeness
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          CONFIG_DIR="composite-builds/build-logic/common/src/main/java/com/itsaky/androidide/build/config"
          for file in BuildConfig.kt CI.kt FDroidConfig.kt ProjectConfig.kt VersionUtils.kt config.kt utils.kt; do
            test -f "$CONFIG_DIR/$file"
          done
          test -d composite-builds/build-logic/desugaring
          test -d composite-builds/build-deps-common/desugaring-core
          test -d core/app

      - name: Migrate legacy Kotlin compiler options
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').rglob('build.gradle.kts'):
              text = path.read_text()
              original = text
              text = re.sub(r'\bkotlinOptions\s*\{', 'compilerOptions {', text)
              text = re.sub(r'\bkotlinOptions(?=\s*\.)', 'compilerOptions', text)
              text = re.sub(r'\bjvmTarget\s*=\s*["\']17["\']', 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17', text)
              text = re.sub(r'\bjvmTarget\.set\(\s*["\']17["\']\s*\)', 'jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)', text)
              text = re.sub(r'\bjvmTarget\s*=\s*BuildConfig\.javaVersion\.toString\(\)', 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(BuildConfig.javaVersion.toString())', text)
              text = re.sub(r'\bfreeCompilerArgs\s*\+=\s*listOf\(([^\n]*)\)', r'freeCompilerArgs.addAll(listOf(\1))', text)
              text = re.sub(r'\bfreeCompilerArgs\s*\+=\s*([^\n]+)', r'freeCompilerArgs.add(\1)', text)
              if text != original:
                  path.write_text(text)

          leftovers = [str(p) for p in Path('.').rglob('build.gradle.kts') if re.search(r'\bkotlinOptions\b', p.read_text())]
          if leftovers:
              raise SystemExit('legacy kotlinOptions remains: ' + ', '.join(leftovers))
          PY

      - name: Build OurIDE
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          ./gradlew :core:app:assembleDebug --stacktrace --no-daemon
          APK="$(find core/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "OurIDE Debug APK created successfully: $APK"

    artifacts:
      - "core/app/build/outputs/apk/debug/*.apk"
      - "core/app/build/outputs/apk/debug/output-metadata.json"
